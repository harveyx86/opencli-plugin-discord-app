name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install plugin with a separate host
        run: |
          npm install --global @jackwener/opencli@2.0.3 --ignore-scripts
          opencli plugin install "$GITHUB_WORKSPACE"
          opencli adapter check discord-app
          opencli list discord-app
